[project]
name = "common"
version = "0.1.0"
description = "Shared code for the blenderServices backends"
readme = "README.md"
authors = [
    { name = "Anatole Dupuis", email = "anatole.dupuis@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.95",
    "botocore>=1.43.95",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.14.0",
    "sqlmodel>=0.0.42",
    "zstandard>=0.25.0",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "common"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]