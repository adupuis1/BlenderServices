server {
    listen 80;

    location = / { return 302 /projects/; }

    # ProjectService: API + its Swagger (/api/v1/projects/docs)
    location /api/v1/projects {
        proxy_pass http://project-backend:8000;
        proxy_set_header Host $host;
    }

    # Everything else: LoginService frontend nginx.
    # It serves /auth/ and already forwards /api/ to the login backend.
    location / {
        proxy_pass http://loginservice-frontend-1:80;
        proxy_set_header Host $host;
    }
}