name: blenderservices

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: blender
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: blender
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blender -d blender"]
      interval: 5s
      timeout: 5s
      retries: 20
      
  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: projectService/backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://blender:${POSTGRES_PASSWORD}@db:5432/blender
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_INTERNAL_ENDPOINT: ${S3_INTERNAL_ENDPOINT}
      LOGIN_SERVICE_URL: ${LOGIN_SERVICE_URL}
    networks:
      - default
      - login
    ports:
      - "8010:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  db-data:
  minio-data:

networks:
  login:
    external: true
    name: ${LOGIN_NETWORK}